openapi: 3.1.0
info:
  title: RFA knowledge contract (실무대장 ↔ 언론사)
  version: 0.1.0
  description: |
    언론사(writer)가 지식을 얻는 유일한 창구. 제공자는 민섭님의 실무대장(Task supervisor).
    RFA_module 에는 같은 계약을 지키는 stub(services/knowledge_stub)이 있다.
    "DB 검색"이 아니라 "task supervisor 에게 질문" 의미: 뒤에서 task 에이전트가 동적으로 생기든
    토론을 하든, 호출자는 answer 와 sources 만 받는다.
servers:
  - url: http://127.0.0.1:8791
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: 지금 살아 있는 task 목록 (동적)
      responses:
        "200":
          description: task 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TaskInfo" }
  /tasks/{task_id}/ask:
    post:
      operationId: askTask
      summary: task supervisor 에게 질문
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
      responses:
        "200":
          description: 답변과 근거
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeResult" }
        "404":
          description: 없는 task
components:
  schemas:
    TaskInfo:
      type: object
      required: [id, name, description, updated_at]
      properties:
        id: { type: string, examples: [triv3] }
        name: { type: string }
        description: { type: string }
        updated_at: { type: string, format: date }
    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string }
        requester_role:
          type: string
          description: 누가 묻는지 (press 등). 실무대장이 응답 범위를 줄이는 데 쓸 수 있음(선택)
        channel:
          type: string
          enum: [public, internal]
          description: 답변이 나갈 채널(선택)
    KnowledgeEntry:
      type: object
      required: [id, title, summary, task_id, updated_at]
      properties:
        id: { type: string, description: 실무대장 내부 식별자 }
        title: { type: string }
        summary: { type: string }
        task_id: { type: string }
        tags: { type: array, items: { type: string } }
        updated_at: { type: string, format: date }
        source: { type: string, enum: [note, web, inference] }
    KnowledgeResult:
      type: object
      required: [task_id, answer, confidence, sources]
      properties:
        task_id: { type: string }
        answer: { type: string, description: supervisor 가 정리한 답 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        sources:
          type: array
          description: answer 의 근거. editor 근거 대조와 censor 출처 추적에 필수
          items: { $ref: "#/components/schemas/KnowledgeEntry" }
