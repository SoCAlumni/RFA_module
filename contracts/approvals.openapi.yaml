openapi: 3.1.0
info:
  title: RFA approvals contract (결재 백엔드)
  version: 0.3.0
  description: |
    사람 결재 안건의 저장·조회·승인·거절. 서버는 RFA_module 의 services/approvals (127.0.0.1:8790).

    태그 `frontend` 는 웹 프런트엔드(다영님)가 부르는 것, `internal` 은 대응 에이전트(desk)만 부르는 것.

    상태:
      pending → approved → posted          (승인. approve 한 요청 안에서 게시까지)
      pending → rejected → pending          (거절 → desk 가 다시 써서 revise, round+1)
      rejected → closed                     (3회 거절)

    인증 없음. CORS 는 RFA_CORS_ORIGINS (기본 *).
servers:
  - url: http://127.0.0.1:8790
tags:
  - name: frontend
    description: 웹 프런트엔드가 부르는 것
  - name: internal
    description: desk(대응 에이전트)만 부르는 것. 프런트는 쓰지 않는다
paths:
  /approvals:
    get:
      tags: [frontend]
      operationId: listApprovals
      summary: 안건 목록 (updated_at 최신순). status·channel·task 로 거른다
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApprovalStatus" }
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/ChannelKind" }
        - name: task
          in: query
          schema: { type: string, examples: [orbit] }
          description: TaskRef.id
      responses:
        "200":
          description: 안건 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Approval" }
    post:
      tags: [internal]
      operationId: createApproval
      summary: 안건 생성 (→ pending). 같은 source_url 의 안건이 있으면 새로 만들지 않고 그걸 돌려준다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApprovalRequest" }
      responses:
        "201":
          description: 새로 만들어짐
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "200":
          description: 같은 source_url 의 안건이 이미 있음. 그 안건을 돌려준다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "422":
          description: 요청 형식 오류
  /approvals/summary:
    get:
      tags: [frontend]
      operationId: approvalSummary
      summary: 채널별·업무별 상태 건수 (사이드바용)
      responses:
        "200":
          description: 건수
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalSummary" }
              example:
                by_channel:
                  github: { pending: 2, posted: 5 }
                  slack: { pending: 1, rejected: 1 }
                by_task:
                  orbit: { pending: 2, posted: 3 }
                  prism: { pending: 1 }
                  "(none)": { posted: 2, rejected: 1 }
  /approvals/{id}:
    get:
      tags: [frontend]
      operationId: getApproval
      summary: 안건 하나
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: 안건
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404":
          description: 없는 안건
  /approvals/{id}/approve:
    post:
      tags: [frontend]
      operationId: approveApproval
      summary: 사람 승인 → 채널에 게시 (pending → approved → posted)
      description: |
        게시까지 한 요청 안에서 끝난다. 채널 게시가 실패하면 502 를 돌려주고 안건은 approved 에 머문다.
        그 상태에서 다시 approve 하면 게시만 다시 시도한다.

        v0.3.0: 본문 `{draft}` 는 선택이다. 사람이 고친 최종 본문을 보내면 pending 에서만 받아
        게시 전에 draft 를 바꾸고, 원래 초안을 `edits` 에 남긴다(이벤트 `human approved "edited"`).
        본문이 없거나 draft 가 비었거나 저장된 초안과 같으면 지금처럼 저장된 초안을 게시한다.
        approved(게시 재시도) 상태에서 다른 본문이 오면 409 `edit_not_allowed` — 고친 본문은 한 번만 확정한다.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveRequest" }
      responses:
        "200":
          description: 게시됨 (status posted, posted_url 채워짐)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404":
          description: 없는 안건
        "409":
          description: pending 도 approved 도 아닌 안건, 또는 approved 에서 고친 본문(edit_not_allowed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: 채널 게시 실패. 안건은 approved 로 남는다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /approvals/{id}/reject:
    post:
      tags: [frontend]
      operationId: rejectApproval
      summary: 사람 거절 (pending → rejected). 3회째면 closed
      description: |
        거절된 초안과 사유가 rejections 에 쌓인다. desk 가 rejected 안건을 보고 head agent 에
        사유를 실어 다시 지식을 받아 초안을 새로 쓴 뒤 revise 로 올린다.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectRequest" }
      responses:
        "200":
          description: 거절됨 (status rejected, 또는 3회째면 closed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404":
          description: 없는 안건
        "409":
          description: pending 이 아닌 안건
        "422":
          description: reason 이 비어 있음
  /approvals/{id}/revise:
    post:
      tags: [internal]
      operationId: reviseApproval
      summary: 거절된 안건에 새 초안을 올림 (rejected → pending, round+1)
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviseApprovalRequest" }
      responses:
        "200":
          description: 다시 결재 대기
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404":
          description: 없는 안건
        "409":
          description: rejected 가 아닌 안건
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    ChannelKind:
      type: string
      enum: [github, slack]
    Audience:
      type: string
      enum: [public, company]
    ApprovalStatus:
      type: string
      enum: [pending, approved, posted, rejected, closed]
    ThreadMessage:
      type: object
      required: [author, text, at]
      properties:
        author: { type: string }
        text: { type: string }
        at: { type: string, format: date-time }
    Rejection:
      type: object
      required: [draft, reason, at]
      properties:
        draft: { type: string, description: 거절된 초안 전문 }
        reason: { type: string }
        at: { type: string, format: date-time }
    TaskRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    Event:
      type: object
      required: [at, who, what]
      properties:
        at: { type: string, format: date-time }
        who: { type: string, examples: [desk, human, publisher] }
        what: { type: string, description: 옮겨 간 상태 }
        detail: { type: [string, "null"] }
    CreateApprovalRequest:
      type: object
      required: [channel, audience, target, source_url, requester, question, knowledge, draft]
      properties:
        channel: { $ref: "#/components/schemas/ChannelKind" }
        audience: { $ref: "#/components/schemas/Audience" }
        target:
          type: string
          description: "답글이 달릴 자리. github: owner/repo#N, slack: <channel_id>/<thread_ts>"
        source_url: { type: string, format: uri, description: 멘션의 주소. 같은 주소면 안건을 새로 만들지 않는다 }
        requester: { type: string }
        question: { type: string }
        context:
          type: array
          items: { $ref: "#/components/schemas/ThreadMessage" }
        task:
          oneOf:
            - $ref: "#/components/schemas/TaskRef"
            - type: "null"
        knowledge: { type: string, description: head agent 가 준 검열된 지식 }
        refusal: { type: [string, "null"] }
        draft: { type: string, description: 게시할 초안 }
    ReviseApprovalRequest:
      type: object
      required: [knowledge, draft]
      properties:
        task:
          oneOf:
            - $ref: "#/components/schemas/TaskRef"
            - type: "null"
        knowledge: { type: string }
        refusal: { type: [string, "null"] }
        draft: { type: string }
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, examples: ["릴리즈 날짜가 들어가 있음"] }
    ApproveRequest:
      type: object
      description: 승인 본문(선택). 사람이 고친 최종 초안. 없거나 비면 저장된 초안을 게시한다
      properties:
        draft: { type: [string, "null"], examples: ["안녕하세요. ORBIT 벤치마크 결과는 공개 전입니다."] }
    Edit:
      type: object
      required: [draft, at]
      description: 승인 때 사람이 고치기 전의 원래 초안
      properties:
        draft: { type: string }
        at: { type: string, format: date-time }
    Approval:
      allOf:
        - $ref: "#/components/schemas/CreateApprovalRequest"
        - type: object
          required: [id, status, round, rejections, events, created_at, updated_at]
          properties:
            id: { type: integer }
            status: { $ref: "#/components/schemas/ApprovalStatus" }
            round: { type: integer, minimum: 1, description: 몇 번째 초안인지. 거절 후 revise 마다 +1 }
            rejections:
              type: array
              description: 거절 이력, 오래된 순
              items: { $ref: "#/components/schemas/Rejection" }
            edits:
              type: array
              description: 승인 때 사람이 고친 경우 원래 초안(고친 본문은 draft). v0.3.0
              items: { $ref: "#/components/schemas/Edit" }
            posted_url: { type: [string, "null"], description: 게시된 답글 주소 }
            events:
              type: array
              items: { $ref: "#/components/schemas/Event" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
      example:
        id: 12
        status: pending
        round: 2
        channel: github
        audience: public
        task: { id: orbit, name: "ORBIT 벤치마크" }
        target: "team/rfa-test#34"
        source_url: "https://github.com/team/rfa-test/issues/34#issuecomment-1"
        requester: outside-dev
        question: "ORBIT 벤치마크 결과가 언제쯤 공개되나요?"
        context:
          - { author: outside-dev, text: "ORBIT 벤치마크 결과가 언제쯤 공개되나요?", at: "2026-09-27T08:40:00Z" }
        knowledge: "ORBIT는 INT4 양자화 후 EM이 소폭 하락했고 QAT로 보완 중이다."
        refusal: null
        draft: "안녕하세요. ORBIT 벤치마크는 양자화 이후 정확도 보완 작업을 진행 중입니다."
        rejections:
          - { draft: "안녕하세요. ORBIT 는 11/3 릴리즈에 맞춰 …", reason: "릴리즈 날짜가 들어가 있음", at: "2026-09-27T09:10:00Z" }
        posted_url: null
        events:
          - { at: "2026-09-27T08:41:00Z", who: desk, what: pending, detail: null }
          - { at: "2026-09-27T09:10:00Z", who: human, what: rejected, detail: "릴리즈 날짜가 들어가 있음" }
          - { at: "2026-09-27T09:11:00Z", who: desk, what: pending, detail: "round 2" }
        created_at: "2026-09-27T08:41:00Z"
        updated_at: "2026-09-27T09:11:00Z"
    ApprovalSummary:
      type: object
      required: [by_channel, by_task]
      properties:
        by_channel:
          type: object
          description: 채널 → 상태 → 건수
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
        by_task:
          type: object
          description: task id → 상태 → 건수. task 가 없는 안건은 키 "(none)"
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, examples: [invalid_transition, publish_failed] }
        detail: { type: string }
