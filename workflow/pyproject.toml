[project]
name = "rfa-workflow"
version = "0.1.0"
description = "Public 대응 LangGraph 워크플로 (샌드박스에서 실행)"
requires-python = ">=3.12"
dependencies = [
    "rfa-common",
    "langgraph>=1.0",
    "anthropic>=1.0",
    "httpx>=0.27",
]

[tool.uv.sources]
rfa-common = { workspace = true }

[project.scripts]
rfa-workflow = "rfa_workflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfa_workflow"]
