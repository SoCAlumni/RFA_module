[project]
name = "rfa-services"
version = "0.1.0"
description = "호스트 서비스: approvals(결재 서버), head_stub, channels"
requires-python = ">=3.12"
dependencies = [
    "rfa-common",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "slack-sdk>=3.44.1",
]

[tool.uv.sources]
rfa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["approvals", "head_stub", "channels"]
