[project]
name = "rfa-services"
version = "0.1.0"
description = "호스트 서비스: 공용 모델, knowledge stub, review, mcp_channels"
requires-python = ">=3.12"
dependencies = [
    "rfa-common",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=2.2,<3",
]

[tool.uv.sources]
rfa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledge_stub", "review", "mcp_channels", "rfa_hostserve"]
