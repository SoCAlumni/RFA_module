[project]
name = "rfa-services"
version = "0.1.0"
description = "호스트 서비스: head_stub, channels (Step 3 부터 approvals)"
requires-python = ">=3.12"
dependencies = [
    "rfa-common",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.uv.sources]
rfa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["head_stub", "channels"]
