<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFA 결재함</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #3b5bdb; --ok: #2b8a3e; --warn: #e67700; --bad: #c92a2a; --mark: #ffe8a3;
    --mark-scan: #ffd6d6; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #98a1b3; --line: #2c323d;
      --accent: #7b93ff; --ok: #69db7c; --warn: #ffa94d; --bad: #ff6b6b; --mark: #5c4a12;
      --mark-scan: #5c1f1f; --chip: #262b35;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { margin: 0; font-size: 17px; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 340px 1fr; flex: 1; min-height: 0; }
  #list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  #list .empty, #detail .empty { padding: 24px; color: var(--muted); }
  .item { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--chip); }
  .item.selected { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
  .item .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .item .target { font-weight: 600; font-size: 13px; }
  .item .q { color: var(--muted); font-size: 12px; margin-top: 4px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
           background: var(--chip); color: var(--muted); }
  .badge.wait { background: var(--warn); color: #fff; }
  .badge.done { background: var(--ok); color: #fff; }
  .badge.bad { background: var(--bad); color: #fff; }
  .new { font-size: 10px; font-weight: 700; color: var(--accent); margin-left: 6px; }
  #detail { overflow-y: auto; padding: 20px 28px 60px; }
  #detail h2 { margin: 0 0 4px; font-size: 18px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  .meta a { color: var(--accent); }
  section.step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
                 padding: 14px 16px; margin-bottom: 12px; }
  section.step h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600;
                    display: flex; justify-content: space-between; }
  section.step h3 .who { font-weight: 400; }
  .text { white-space: pre-wrap; word-break: break-word; }
  .sources { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  mark.scan { background: var(--mark-scan); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--chip); }
  .chip b { font-weight: 600; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .compare .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .edit { border-left: 3px solid var(--line); padding-left: 10px; margin: 6px 0; font-size: 13px; }
  .edit.revise { border-color: var(--warn); }
  .edit.pass { border-color: var(--ok); }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .actions textarea { width: 100%; min-height: 60px; padding: 8px; border-radius: 8px;
                      border: 1px solid var(--line); background: var(--bg); color: var(--text);
                      font: inherit; }
  .actions .buttons { display: flex; gap: 8px; }
  button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 0; cursor: pointer; }
  button.approve { background: var(--ok); color: #fff; }
  button.reject { background: var(--bad); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .notice { font-size: 13px; color: var(--muted); }
  .error { color: var(--bad); font-size: 13px; }
  .timeline { font-size: 12px; color: var(--muted); margin: 0; padding-left: 18px; }
</style>
</head>
<body>
<header>
  <h1>RFA 결재함</h1>
  <span class="sub">외부 요청 → 초안 → 기밀검토 → 사람 결재. 3초마다 새로고침.</span>
</header>
<main>
  <nav id="list"><div class="empty">불러오는 중…</div></nav>
  <article id="detail"><div class="empty">왼쪽에서 결재 문서를 고르세요.</div></article>
</main>
<script>
"use strict";
// 이 페이지는 외부(GitHub, LLM)에서 온 텍스트를 보여준다. 모든 데이터는 textContent 로만 넣는다.

const POLL_MS = 3000;
const STATUS = {
  opened: ["진행 중", ""], knowledge_ready: ["진행 중", ""], drafted: ["진행 중", ""],
  scanned: ["검토 중", ""], reviewed: ["결재 대기", "wait"], approved: ["게시 실패", "bad"],
  posted: ["게시됨", "done"], rejected: ["거절됨", "bad"], needs_human: ["사람 필요", "wait"],
};

let reviews = [];
let selectedId = Number(location.hash.slice(1)) || null;
let renderedKey = null;         // 선택 문서를 마지막으로 그린 버전 (status + events 수)
const seen = new Set();         // 첫 로드 이후 새로 나타난 문서는 NEW 표시
let firstLoad = true;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function badge(doc) {
  if (doc.status === "reviewed" && doc.verdict?.verdict === "block") {
    return el("span", { class: "badge bad", text: "차단됨" });
  }
  const [label, cls] = STATUS[doc.status] || [doc.status, ""];
  return el("span", { class: `badge ${cls}`, text: label });
}

function fmtTime(iso) {
  return new Date(iso).toLocaleString("ko-KR", {
    month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false });
}

// 원문을 [start,end) 구간 목록으로 잘라 <mark> 를 끼운다. 구간은 겹치지 않는다고 가정.
function highlight(text, ranges) {
  const frag = document.createDocumentFragment();
  let pos = 0;
  for (const r of [...ranges].sort((a, b) => a.start - b.start)) {
    if (r.start < pos) continue;
    frag.append(text.slice(pos, r.start));
    frag.append(el("mark", { class: r.cls || "", title: r.title, text: text.slice(r.start, r.end) }));
    pos = r.end;
  }
  frag.append(text.slice(pos));
  return frag;
}

function reasonRanges(text, reasons) {
  const out = [];
  for (const r of reasons) {
    const i = r.span ? text.indexOf(r.span) : -1;
    if (i >= 0) out.push({ start: i, end: i + r.span.length, title: r.rule });
  }
  return out;
}

function step(title, who, ...body) {
  return el("section", { class: "step" },
    el("h3", {}, el("span", { text: title }), who ? el("span", { class: "who", text: who }) : null),
    ...body);
}

function whoOf(doc, what) {
  const ev = [...doc.events].reverse().find((e) => e.what === what);
  return ev ? `${ev.who} · ${fmtTime(ev.at)}` : "";
}

function renderList() {
  const list = document.getElementById("list");
  if (!reviews.length) {
    list.replaceChildren(el("div", { class: "empty", text: "아직 들어온 요청이 없어요." }));
    return;
  }
  const items = [...reviews].sort((a, b) => b.id - a.id).map((r) => {
    const isNew = !firstLoad && !seen.has(r.id);
    const node = el("div",
      { class: `item${r.id === selectedId ? " selected" : ""}`, onclick: () => select(r.id) },
      el("div", { class: "row" },
        el("span", { class: "target" }, `#${r.id} ${r.target}`,
          isNew ? el("span", { class: "new", text: "NEW" }) : null),
        badge(r)),
      el("div", { class: "q", text: r.question }));
    return node;
  });
  list.replaceChildren(...items);
}

function select(id) {
  selectedId = id;
  seen.add(id);
  location.hash = String(id);
  renderedKey = null;
  renderList();
  renderDetail();
}

function renderDetail() {
  const box = document.getElementById("detail");
  const doc = reviews.find((r) => r.id === selectedId);
  if (!doc) {
    box.replaceChildren(el("div", { class: "empty", text: "왼쪽에서 결재 문서를 고르세요." }));
    renderedKey = null;
    return;
  }
  const key = `${doc.id}:${doc.status}:${doc.events.length}`;
  if (key === renderedKey) return;   // 바뀐 게 없으면 다시 그리지 않는다 (입력 중인 사유 보존)
  renderedKey = key;

  const parts = [
    el("h2", {}, `#${doc.id} `, badge(doc)),
    el("div", { class: "meta" },
      `${doc.channel} · ${doc.requester} · `,
      el("a", { href: doc.source_url, target: "_blank", rel: "noopener", text: doc.target })),
    step("질문", whoOf(doc, "opened"), el("div", { class: "text", text: doc.question })),
  ];

  if (doc.knowledge) {
    parts.push(step(`지식 (task: ${doc.knowledge.task_id}, 신뢰도 ${doc.knowledge.confidence.toFixed(2)})`,
      whoOf(doc, "knowledge_ready"),
      el("div", { class: "text", text: doc.knowledge.answer || "(답 없음)" }),
      doc.knowledge.sources.length
        ? el("ul", { class: "sources" }, ...doc.knowledge.sources.map((s) => el("li", { text: s })))
        : null));
  }

  if (doc.draft != null) {
    const scanRanges = doc.scan.map((h) => ({
      start: h.span[0], end: h.span[1], cls: "scan", title: `scanner:${h.type}` }));
    parts.push(step("초안 (스캔 결과 표시)", whoOf(doc, "drafted"),
      el("div", { class: "text" }, highlight(doc.draft, scanRanges)),
      doc.scan.length
        ? el("div", { class: "chips" }, ...doc.scan.map((h) =>
            el("span", { class: "chip" }, el("b", { text: h.type }), ` ${h.match}`)))
        : el("div", { class: "notice", text: "스캐너가 찾은 비밀값 없음" })));
  }

  if (doc.edit_log.length) {
    parts.push(step("첨삭 이력", "", ...doc.edit_log.map((e) =>
      el("div", { class: `edit ${e.verdict}` },
        `${e.round}회차 · ${e.verdict === "pass" ? "통과" : "수정 요청"}`,
        e.notes ? ` — ${e.notes}` : "",
        e.issues.length ? ` (${e.issues.join(", ")})` : ""))));
  }

  if (doc.verdict) {
    const v = doc.verdict;
    const label = { allow: "허용", redact: "일부 삭제", block: "차단" }[v.verdict];
    parts.push(step(`기밀검토: ${label}`, whoOf(doc, "reviewed"),
      el("div", { class: "notice", text: v.summary }),
      el("div", { class: "compare" },
        el("div", {}, el("div", { class: "label", text: "원본 초안" }),
          el("div", { class: "text" }, highlight(doc.draft || "", reasonRanges(doc.draft || "", v.reasons)))),
        el("div", {}, el("div", { class: "label", text: "게시될 본문" }),
          el("div", { class: "text", text: doc.final_body ?? "(게시 불가)" }))),
      v.reasons.length
        ? el("div", { class: "chips" }, ...v.reasons.map((r) =>
            el("span", { class: "chip" }, el("b", { text: r.rule }), ` ${r.action}: ${r.span}`)))
        : null));
  }

  parts.push(renderActions(doc));
  parts.push(step("기록", "", el("ol", { class: "timeline" }, ...doc.events.map((e) =>
    el("li", { text: `${fmtTime(e.at)} · ${e.who} → ${e.what}${e.detail ? ` (${e.detail})` : ""}` })))));
  box.replaceChildren(...parts);
}

function renderActions(doc) {
  if (doc.status === "posted") {
    const url = doc.events.findLast((e) => e.what === "posted")?.detail;
    return step("결재 완료", whoOf(doc, "approved"), el("div", { class: "notice", text: `게시됨: ${url || ""}` }));
  }
  if (doc.status === "rejected") {
    return step("거절됨", whoOf(doc, "rejected"),
      el("div", { class: "text", text: doc.decision?.reason || "" }),
      el("div", { class: "notice", text: "사유는 기밀 기준 피드백으로 쌓였어요. 사유를 반영한 재작성은 준비 중(Step 12+)." }));
  }
  if (doc.status === "approved") {
    return step("게시 실패", whoOf(doc, "approved"),
      el("div", { class: "notice", text: "승인됐지만 게시에 실패했어요. 재게시는 준비 중(Step 12+)." }));
  }
  if (doc.status === "needs_human") {
    return step("사람 확인 필요", "", el("div", { class: "text", text: doc.events.at(-1)?.detail || "" }));
  }
  if (doc.status !== "reviewed") {
    return step("결재", "", el("div", { class: "notice", text: "아직 에이전트가 작업 중이에요." }));
  }

  const blocked = doc.verdict?.verdict === "block";
  const reason = el("textarea", { placeholder: "거절 사유 (필수). 다음 기밀검토의 기준으로 쌓여요." });
  const error = el("div", { class: "error" });
  const approveBtn = el("button", { class: "approve", text: "승인하고 게시" });
  const rejectBtn = el("button", { class: "reject", text: "거절" });
  approveBtn.disabled = blocked;

  async function act(path, body) {
    approveBtn.disabled = rejectBtn.disabled = true;
    error.textContent = "";
    try {
      const res = await fetch(`/reviews/${doc.id}/${path}`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: body ? JSON.stringify(body) : undefined });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(`${res.status} ${data.error || ""} ${data.detail || ""}`.trim());
      }
      await refresh();
    } catch (e) {
      error.textContent = `실패: ${e.message}`;
      approveBtn.disabled = blocked;
      rejectBtn.disabled = false;
    }
  }
  approveBtn.addEventListener("click", () => act("approve"));
  rejectBtn.addEventListener("click", () => {
    if (!reason.value.trim()) { error.textContent = "거절 사유를 적어 주세요."; reason.focus(); return; }
    act("reject", { reason: reason.value.trim() });
  });

  return step("결재", "",
    el("div", { class: "actions" },
      blocked ? el("div", { class: "notice", text: "기밀검토가 차단했어요. 승인할 수 없어요." }) : null,
      reason, el("div", { class: "buttons" }, approveBtn, rejectBtn), error));
}

async function refresh() {
  try {
    const res = await fetch("/reviews");
    reviews = await res.json();
  } catch {
    return;   // 서버가 잠깐 없으면 다음 폴링에서 다시
  }
  if (firstLoad) { reviews.forEach((r) => seen.add(r.id)); firstLoad = false; }
  renderList();
  renderDetail();
}

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
