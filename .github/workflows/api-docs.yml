# contracts/*.openapi.yaml 을 GitHub Pages 에 Redoc 문서로 배포한다.
name: api-docs

on:
  push:
    branches: [main]
    paths: ["contracts/**", "scripts/build_api_docs.sh", ".github/workflows/api-docs.yml"]
  pull_request:
    paths: ["contracts/**", "scripts/build_api_docs.sh", ".github/workflows/api-docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: ./scripts/build_api_docs.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
