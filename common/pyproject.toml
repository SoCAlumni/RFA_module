[project]
name = "rfa-common"
version = "0.1.0"
description = "모듈 간 계약의 공용 데이터 모델 (호스트 서비스와 샌드박스 워크플로가 함께 씀)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfa_common"]
